<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare AI - 暖心寵物空間</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        /* 暖色調背景與動畫 */
        body { background-color: #fffaf0; }
        .bg-warm-gradient { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .tab-active { color: #f6ad55; border-bottom: 3px solid #f6ad55; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
    </style>
</head>
<body class="font-sans">
    <div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col">
        
        <div class="p-6 bg-warm-gradient text-white flex items-center space-x-4 shadow-md">
            <div @click="$refs.avatarInput.click()" class="relative group cursor-pointer">
                <div class="w-16 h-16 rounded-full border-2 border-white/50 overflow-hidden bg-white/20 flex items-center justify-center backdrop-blur-sm">
                    <img v-if="petAvatar" :src="petAvatar" class="w-full h-full object-cover">
                    <span v-else class="text-2xl">🐾</span>
                </div>
                <input type="file" ref="avatarInput" class="hidden" @change="handleAvatarUpload" accept="image/*">
            </div>
            <div class="flex-1">
                <h2 class="text-xl font-bold">{{ petName || '我的小寶貝' }}</h2>
                <p class="text-xs opacity-80">陪伴是最好的禮物</p>
            </div>
        </div>

        <div class="flex border-b bg-orange-50/30 overflow-x-auto whitespace-nowrap scrollbar-hide">
            <button v-for="n in 4" @click="tab = n" :class="tab === n ? 'tab-active' : 'text-gray-400 border-transparent'" class="flex-1 py-3 px-2 text-center text-sm font-bold transition-all">
                {{ ['生活', '健檢', '捐款', '設定'][n-1] }}
            </button>
        </div>

        <div class="flex-1 p-4 overflow-y-auto">
            
            <div v-if="tab === 1" class="space-y-4 animate-fade-in">
                <div class="bg-orange-100/50 p-4 rounded-2xl border border-orange-200">
                    <p class="text-orange-600 font-bold mb-1">今日天氣</p>
                    <div v-if="weather" class="flex justify-between items-end">
                        <span class="text-3xl font-bold text-orange-700">{{ weather.temp }}°</span>
                        <span class="text-sm text-orange-500">{{ weather.advice }}</span>
                    </div>
                </div>
                <div class="space-y-3">
                    <h3 class="font-bold text-gray-700">飲食記錄</h3>
                    <input v-model="diet.eat" type="text" placeholder="吃了什麼..." class="w-full p-3 bg-gray-50 rounded-xl border-none focus:ring-2 focus:ring-orange-200">
                    <input v-model="diet.drink" type="text" placeholder="喝了什麼..." class="w-full p-3 bg-gray-50 rounded-xl border-none focus:ring-2 focus:ring-orange-200">
                    <button @click="saveLog" class="w-full bg-orange-400 text-white py-3 rounded-xl font-bold shadow-lg shadow-orange-100">存檔</button>
                </div>
            </div>

            <div v-if="tab === 2" class="space-y-4 animate-fade-in flex flex-col items-center">
                <div @click="$refs.fileInput.click()" class="w-full aspect-square border-2 border-dashed border-orange-200 rounded-3xl bg-orange-50/30 flex flex-col items-center justify-center cursor-pointer overflow-hidden">
                    <img v-if="imagePreview" :src="imagePreview" class="w-full h-full object-cover">
                    <div v-else class="text-orange-300 text-center">
                        <p class="text-5xl mb-2">+</p>
                        <p>上傳牙齒照片</p>
                    </div>
                    <input type="file" ref="fileInput" class="hidden" @change="handleFileUpload" accept="image/*">
                </div>
                <div v-if="imagePreview" class="w-full bg-orange-100/50 p-4 rounded-2xl border border-orange-200">
                    <p class="text-orange-700 font-bold">AI 建議：</p>
                    <p class="text-sm text-orange-600">偵測完成，目前狀況良好，請保持刷牙習慣。</p>
                </div>
            </div>

            <div v-if="tab === 3" class="space-y-4 animate-fade-in">
                <h3 class="font-bold text-gray-700">台灣動物保護機構</h3>
                <div class="grid gap-3">
                    <a v-for="org in charityOrgs" :href="org.url" target="_blank" class="flex items-center p-3 bg-white border border-gray-100 rounded-2xl shadow-sm hover:bg-orange-50 transition-colors">
                        <div class="w-12 h-12 bg-orange-100 rounded-xl flex items-center justify-center text-xl mr-3">{{ org.icon }}</div>
                        <div class="flex-1">
                            <p class="font-bold text-gray-700 text-sm">{{ org.name }}</p>
                            <p class="text-xs text-gray-400 leading-tight">{{ org.desc }}</p>
                        </div>
                        <span class="text-orange-300 text-xl">♥</span>
                    </a>
                </div>
            </div>

            <div v-if="tab === 4" class="space-y-6 animate-fade-in">
                <div class="space-y-4">
                    <div class="flex justify-between items-center py-2 border-b border-gray-100">
                        <span class="text-gray-600">毛小孩名字</span>
                        <input v-model="petName" @blur="savePetConfig" class="text-right text-orange-500 font-bold focus:outline-none">
                    </div>
                    <div class="flex justify-between items-center py-2 border-b border-gray-100">
                        <span class="text-gray-600">提醒設定</span>
                        <div class="w-10 h-6 bg-orange-400 rounded-full relative"><div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full"></div></div>
                    </div>
                    <div class="py-2">
                        <p class="text-gray-600 mb-2">一週回顧預覽</p>
                        <div class="h-32 bg-gray-50 rounded-2xl flex items-center justify-center border border-dashed border-gray-200 text-gray-400 text-xs">
                            數據累積中，AI 影片功能開發中...
                        </div>
                    </div>
                </div>
                <button @click="clearData" class="w-full text-red-400 text-sm underline pt-10">清除所有記錄</button>
            </div>

        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const tab = ref(1);
                const petName = ref(localStorage.getItem('petName') || '我的寶貝');
                const petAvatar = ref(localStorage.getItem('petAvatar') || null);
                const weather = ref({ temp: 26, advice: '天氣晴朗，適合散步' });
                const diet = ref({ eat: '', drink: '' });
                const history = ref(JSON.parse(localStorage.getItem('petLogs') || '[]'));
                const imagePreview = ref(null);

                const charityOrgs = [
                    { name: '台灣動物緊急救援小組', desc: '傷病流浪動物救援與國際認養', icon: '🚑', url: 'https://www.savedogs.org' },
                    { name: '惠光導盲犬教育基金會', desc: '視障者導盲犬培訓與推廣', icon: '🦮', url: 'https://www.guidedog.org.tw' },
                    { name: '台灣防止虐待動物協會 (SPCA)', desc: '動物福利法律推動與虐待案件調查', icon: '⚖️', url: 'https://www.spca.org.tw' },
                    { name: '流浪動物花園協會', desc: '推廣認養代替購買，愛心送養平台', icon: '🏡', url: 'http://www.doghome.org.tw' },
                    { name: '台灣心輔犬培育團隊', desc: '將浪浪培訓為專業心理輔助犬', icon: '💖', url: 'https://www.pawsforlove.com.tw' }
                ];

                const handleAvatarUpload = (e) => {
                    const reader = new FileReader();
                    reader.onload = (ev) => { petAvatar.value = ev.target.result; savePetConfig(); };
                    reader.readAsDataURL(e.target.files[0]);
                };

                const savePetConfig = () => {
                    localStorage.setItem('petName', petName.value);
                    if (petAvatar.value) localStorage.setItem('petAvatar', petAvatar.value);
                };

                const saveLog = () => {
                    if (!diet.value.eat && !diet.value.drink) return;
                    history.value.push({ ...diet.value, time: new Date().toLocaleDateString() });
                    localStorage.setItem('petLogs', JSON.stringify(history.value));
                    diet.value = { eat: '', drink: '' };
                    alert('記錄已儲存！');
                };

                const handleFileUpload = (e) => {
                    const file = e.target.files[0];
                    if (file) imagePreview.value = URL.createObjectURL(file);
                };

                const clearData = () => { if(confirm('確定要清除所有數據嗎？')) { localStorage.clear(); location.reload(); } };

                return { tab, petName, petAvatar, weather, diet, history, imagePreview, charityOrgs, handleAvatarUpload, savePetConfig, saveLog, handleFileUpload, clearData };
            }
        }).mount('#app');
    </script>
</body>
</html>
