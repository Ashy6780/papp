<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare AI - 個人化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100">
    <div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
        
        <div class="p-6 bg-gradient-to-r from-blue-500 to-blue-600 text-white flex items-center space-x-4">
            <div @click="$refs.avatarInput.click()" class="relative group cursor-pointer">
                <div class="w-20 h-20 rounded-full border-4 border-white overflow-hidden bg-white shadow-inner flex items-center justify-center text-gray-300">
                    <img v-if="petAvatar" :src="petAvatar" class="w-full h-full object-cover">
                    <svg v-else class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <div class="absolute inset-0 bg-black bg-opacity-40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-xs font-bold">更換</div>
            </div>
            
            <input type="file" ref="avatarInput" class="hidden" @change="handleAvatarUpload" accept="image/*">
            
            <div class="flex-1">
                <input v-model="petName" @blur="savePetConfig" type="text" placeholder="輸入毛小孩名字" class="text-2xl font-bold bg-transparent border-b border-transparent hover:border-white focus:border-white focus:outline-none w-full p-1 -ml-1">
                <p class="text-xs text-blue-100 mt-1">健康記錄已開啟</p>
            </div>
        </div>

        <div class="flex border-b">
            <button @click="tab = 1" :class="tab === 1 ? 'border-blue-500 text-blue-600' : 'border-transparent'" class="flex-1 py-4 text-center border-b-2 font-bold">寵物生活</button>
            <button @click="tab = 2" :class="tab === 2 ? 'border-blue-500 text-blue-600' : 'border-transparent'" class="flex-1 py-4 text-center border-b-2 font-bold">牙齒健檢</button>
        </div>

        <div v-if="tab === 1" class="p-4 space-y-6">
            <div class="bg-blue-50 p-4 rounded-xl shadow-sm">
                <h3 class="text-sm text-blue-500 font-bold mb-2">今日天氣預測</h3>
                <div v-if="weather" class="flex items-center justify-between">
                    <div>
                        <div class="text-2xl font-bold">{{ weather.temp }}°C</div>
                        <div class="text-gray-600">{{ weather.description }}</div>
                    </div>
                    <div class="text-right text-xs text-blue-400">
                        {{ weather.advice }}
                    </div>
                </div>
                <div v-else class="animate-pulse flex space-x-4">獲取天氣中...</div>
            </div>

            <div class="space-y-4">
                <h3 class="font-bold text-gray-700">飲食登記</h3>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-500">吃了什麼？</label>
                        <input v-model="diet.eat" type="text" placeholder="例如：乾乾 50g" class="w-full border rounded-lg p-2 mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">喝了多少？</label>
                        <input v-model="diet.drink" type="text" placeholder="例如：水 200ml" class="w-full border rounded-lg p-2 mt-1">
                    </div>
                    <button @click="saveLog" class="w-full bg-blue-500 text-white py-2 rounded-lg font-bold">儲存紀錄</button>
                </div>
                
                <div v-if="history.length > 0" class="mt-4">
                    <h4 class="text-xs font-bold text-gray-400 uppercase">最近紀錄</h4>
                    <ul class="text-sm divide-y">
                        <li v-for="item in history.slice(-3)" class="py-2 flex justify-between">
                            <span>{{ item.eat }}</span>
                            <span class="text-gray-400">{{ item.time }}</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div v-if="tab === 2" class="p-4 flex flex-col items-center">
            <h3 class="font-bold text-gray-700 mb-4 w-full text-left">AI 牙齒分析</h3>
            
            <div @click="$refs.fileInput.click()" class="w-full h-64 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer overflow-hidden bg-gray-50 hover:border-blue-300 transition-colors">
                <img v-if="imagePreview" :src="imagePreview" class="w-full h-full object-cover">
                <div v-else class="text-gray-400 text-center p-4">
                    <p class="text-4xl mb-2">+</p>
                    <p class="text-sm">上傳寵物牙齒照片</p>
                    <p class="text-xs mt-1 text-gray-300">（上傳後將獲得 AI 診斷建議）</p>
                </div>
                <input type="file" ref="fileInput" class="hidden" @change="handleFileUpload" accept="image/*">
            </div>

            <div v-if="imagePreview" class="mt-6 w-full space-y-4 animate-fade-in">
                <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4">
                    <p class="text-yellow-700 font-bold">AI 診斷建議：</p>
                    <p class="text-sm text-yellow-600 mt-1">
                        照片顯示齒齦邊緣略微發紅，建議增加刷牙頻率。若持續紅腫，請諮詢獸醫師。
                    </p>
                </div>
                <button class="w-full border border-blue-500 text-blue-500 py-2 rounded-lg text-sm font-bold hover:bg-blue-50">尋找附近獸醫</button>
            </div>
            
            <div v-else class="mt-8 text-gray-300 text-sm italic">
                安全提示：上傳照片後，AI 將分析健康狀況。此建議僅供參考，不能替代專業獸醫診斷。
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const tab = ref(1);
                
                // 個人化數據 (初始化時從 LocalStorage 讀取)
                const petName = ref(localStorage.getItem('petName') || '我的毛小孩');
                const petAvatar = ref(localStorage.getItem('petAvatar') || null);
                
                const weather = ref(null);
                const diet = ref({ eat: '', drink: '' });
                const history = ref(JSON.parse(localStorage.getItem('petLogs') || '[]'));
                const imagePreview = ref(null);

                // 模擬獲取天氣
                const fetchWeather = () => {
                    setTimeout(() => {
                        weather.value = {
                            temp: 28,
                            description: '晴時多雲',
                            advice: '天氣舒適，適合帶毛孩出門散步！'
                        };
                    }, 1000);
                };

                // 新增：處理頭貼上傳
                const handleAvatarUpload = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    // 1. 為了能永久儲存，需要將圖片轉為 Base64 字符串
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        petAvatar.value = event.target.result; // 在介面上顯示
                        savePetConfig(); // 儲存到 LocalStorage
                    };
                    reader.readAsDataURL(file); // 開始轉換
                };

                // 新增：儲存毛小孩名字與頭貼
                const savePetConfig = () => {
                    localStorage.setItem('petName', petName.value);
                    if (petAvatar.value) {
                        localStorage.setItem('petAvatar', petAvatar.value); // 儲存 Base64 字符串
                    }
                    console.log('配置已儲存');
                };

                const saveLog = () => {
                    if (!diet.value.eat && !diet.value.drink) return;
                    const newLog = {
                        eat: diet.value.eat || '未填寫',
                        drink: diet.value.drink || '未填寫',
                        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                    };
                    history.value.push(newLog);
                    localStorage.setItem('petLogs', JSON.stringify(history.value));
                    diet.value = { eat: '', drink: '' };
                };

                const handleFileUpload = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        imagePreview.value = URL.createObjectURL(file); // 健檢照片只需臨時顯示
                    }
                };

                onMounted(fetchWeather);

                return { 
                    tab, 
                    petName, petAvatar, 
                    weather, diet, history, imagePreview, 
                    handleAvatarUpload, savePetConfig, 
                    saveLog, handleFileUpload 
                };
            }
        }).mount('#app');
    </script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
    </style>
</body>
</html>
