<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare AI - 溫馨毛孩日記</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root {
            --color-beige: #F5F1E9;
            --color-latte: #D2B48C;
            --color-earth: #A67B5B;
            --color-dark: #6F4E37;
        }
        body { background-color: var(--color-beige); color: var(--color-dark); font-family: sans-serif; }
        .bg-earth-gradient { background: linear-gradient(135deg, #D2B48C 0%, #A67B5B 100%); }
        .tab-active { color: var(--color-earth); border-bottom: 3px solid var(--color-earth); }
        .btn-earth { background-color: var(--color-earth); color: white; transition: all 0.2s; }
        .btn-earth:active { transform: scale(0.98); opacity: 0.9; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col border-x border-stone-200">
        
        <div class="p-6 bg-earth-gradient text-white flex items-center space-x-4 shadow-md">
            <div @click="$refs.avatarInput.click()" class="w-16 h-16 rounded-full border-2 border-white/40 overflow-hidden bg-stone-100/20 flex items-center justify-center backdrop-blur-sm cursor-pointer relative group">
                <img v-if="petAvatar" :src="petAvatar" class="w-full h-full object-cover">
                <span v-else class="text-2xl">🐶</span>
            </div>
            <input type="file" ref="avatarInput" class="hidden" @change="handleAvatarUpload" accept="image/*">
            <div class="flex-1">
                <h2 class="text-xl font-bold tracking-wide">{{ petName }}</h2>
                <p class="text-xs opacity-90 font-light italic">{{ t('slogan') }}</p>
            </div>
        </div>

        <div class="flex border-b bg-stone-50 overflow-x-auto scrollbar-hide">
            <button v-for="(label, idx) in ['home', 'health', 'charity', 'settings']" @click="tab = idx + 1" :class="tab === idx + 1 ? 'tab-active' : 'text-stone-400 border-transparent'" class="flex-1 py-3 px-1 text-center text-[10px] font-bold transition-all">
                <div class="text-lg">{{ ['🏠','🦴','🐾','🦮'][idx] }}</div><div>{{ t(label) }}</div>
            </button>
        </div>

        <div class="flex-1 p-5 overflow-y-auto bg-[#FAF9F6]">
            
            <div v-if="tab === 1" class="animate-fade-in space-y-4">
                 <h3 class="font-bold text-stone-700 text-sm">📸 {{ t('daily_photo') }}</h3>
                 <div @click="$refs.dailyPhotoInput.click()" class="w-full aspect-video border-2 border-dashed border-stone-300 rounded-2xl bg-white flex items-center justify-center cursor-pointer overflow-hidden">
                    <img v-if="dailyPhoto" :src="dailyPhoto" class="w-full h-full object-cover">
                    <span v-else class="text-stone-300 text-xs">{{ t('click_upload') }}</span>
                </div>
                <input type="file" ref="dailyPhotoInput" class="hidden" @change="handleDailyPhoto" accept="image/*">
            </div>

            <div v-if="tab === 4" class="space-y-6 animate-fade-in">
                
                <div class="bg-red-50 p-4 rounded-2xl border border-red-100 space-y-4 shadow-sm">
                    <h3 class="text-red-700 font-bold flex items-center text-sm">
                        <span class="mr-2">🆘</span> {{ t('emergency') }}
                    </h3>
                    
                    <div class="space-y-3">
                        <input v-model="hospitalName" placeholder="醫院名稱 (例如：XX 24H 急診)" class="w-full p-3 rounded-xl border-none text-xs outline-none shadow-sm">
                        <input v-model="hospitalPhone" placeholder="醫院電話 (02-xxx / 09xxx)" class="w-full p-3 rounded-xl border-none text-xs outline-none shadow-sm">
                        
                        <div class="flex space-x-2">
                            <input v-model="hospitalAddress" placeholder="醫院地址 (手動輸入)" class="flex-1 p-3 rounded-xl border-none text-xs outline-none shadow-sm">
                            <button @click="getLocation" class="bg-white text-red-600 px-3 rounded-xl text-[10px] shadow-sm border border-red-100">
                                📍 {{ t('get_location') }}
                            </button>
                        </div>

                        <button @click="saveSettings" class="w-full bg-stone-700 text-white py-2 rounded-xl text-xs font-bold hover:bg-stone-800 transition-all">
                            💾 {{ t('save_settings') }}
                        </button>
                    </div>

                    <div v-if="hospitalPhone" class="pt-2 border-t border-red-200">
                        <p class="text-[10px] text-red-500 mb-2 font-bold">{{ t('emergency_ready') }}</p>
                        <div class="bg-white p-3 rounded-xl border border-red-200 flex justify-between items-center shadow-md">
                            <div class="flex-1">
                                <p class="text-xs font-bold text-red-700">{{ hospitalName || '未命名醫院' }}</p>
                                <p class="text-[10px] text-stone-400 truncate">{{ hospitalAddress || '無地址資訊' }}</p>
                            </div>
                            <a :href="'tel:' + hospitalPhone" class="bg-red-600 text-white p-3 rounded-full shadow-lg">
                                📞
                            </a>
                        </div>
                    </div>
                </div>

                <div class="bg-stone-100/50 p-4 rounded-2xl border border-stone-200">
                    <h3 class="text-stone-700 font-bold mb-3 text-sm">🌐 {{ t('lang_setting') }}</h3>
                    <div class="flex bg-white p-1 rounded-xl shadow-inner">
                        <button @click="changeLang('zh')" :class="lang === 'zh' ? 'bg-stone-500 text-white' : 'text-stone-400'" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all">中文</button>
                        <button @click="changeLang('en')" :class="lang === 'en' ? 'bg-stone-500 text-white' : 'text-stone-400'" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all">English</button>
                    </div>
                </div>

                <div class="flex justify-between items-center py-3 border-b border-stone-100">
                    <span class="text-stone-600 text-sm">{{ t('rename') }}</span>
                    <input v-model="petName" @blur="savePetConfig" class="text-right text-stone-800 font-bold focus:outline-none bg-transparent">
                </div>
                <button @click="clearData" class="w-full text-stone-300 text-[10px] underline">{{ t('clear') }}</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const tab = ref(1);
                const lang = ref(localStorage.getItem('lang') || 'zh');
                const petName = ref(localStorage.getItem('petName') || '我的寶貝');
                const petAvatar = ref(localStorage.getItem('petAvatar') || null);
                const dailyPhoto = ref(null);

                // 緊急醫療資料
                const hospitalName = ref(localStorage.getItem('hospitalName') || '');
                const hospitalPhone = ref(localStorage.getItem('hospitalPhone') || '');
                const hospitalAddress = ref(localStorage.getItem('hospitalAddress') || '');

                const i18n = {
                    zh: {
                        slogan: '守護每一天的溫馨', home: '生活', health: '健檢', charity: '愛心', settings: '設定',
                        daily_photo: '今日萌照紀錄', click_upload: '點擊拍照',
                        emergency: '緊急醫療與定位', get_location: '取得位置', save_settings: '儲存設定',
                        emergency_ready: '發生緊急狀況請立即撥打：', lang_setting: '語言設定',
                        rename: '修改名稱', clear: '清除資料'
                    },
                    en: {
                        slogan: 'Cherish every warm moment', home: 'Home', health: 'Health', charity: 'Charity', settings: 'Settings',
                        daily_photo: 'Daily Photo', click_upload: 'Take Photo',
                        emergency: 'Emergency & Location', get_location: 'Get Location', save_settings: 'Save Info',
                        emergency_ready: 'Call immediately in emergency:', lang_setting: 'Language',
                        rename: 'Rename Pet', clear: 'Clear Data'
                    }
                };

                const t = (key) => i18n[lang.value][key];
                const changeLang = (l) => { lang.value = l; localStorage.setItem('lang', l); };

                const getLocation = () => {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition((pos) => {
                            const lat = pos.coords.latitude;
                            const lon = pos.coords.longitude;
                            hospitalAddress.value = `📍 經緯度: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                            alert('位置已取得，別忘了按下儲存設定喔！');
                        }, () => {
                            alert('無法取得定位，請檢查手機權限。');
                        });
                    }
                };

                const saveSettings = () => {
                    localStorage.setItem('hospitalName', hospitalName.value);
                    localStorage.setItem('hospitalPhone', hospitalPhone.value);
                    localStorage.setItem('hospitalAddress', hospitalAddress.value);
                    alert(lang.value === 'zh' ? '設定已成功儲存！' : 'Settings saved successfully!');
                };

                const handleAvatarUpload = (e) => {
                    const reader = new FileReader();
                    reader.onload = (ev) => { petAvatar.value = ev.target.result; localStorage.setItem('petAvatar', petAvatar.value); };
                    reader.readAsDataURL(e.target.files[0]);
                };

                const handleDailyPhoto = (e) => {
                    const reader = new FileReader();
                    reader.onload = (ev) => { dailyPhoto.value = ev.target.result; };
                    reader.readAsDataURL(e.target.files[0]);
                };

                const savePetConfig = () => localStorage.setItem('petName', petName.value);
                const clearData = () => { if(confirm('Clear all?')) { localStorage.clear(); location.reload(); } };

                return { 
                    tab, lang, petName, petAvatar, dailyPhoto, t, changeLang,
                    hospitalName, hospitalPhone, hospitalAddress,
                    getLocation, saveSettings, handleAvatarUpload, handleDailyPhoto, savePetConfig, clearData 
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
